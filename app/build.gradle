plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.simpleapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.simpleapp'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 没有任何额外依赖，只有 Android 核心
}